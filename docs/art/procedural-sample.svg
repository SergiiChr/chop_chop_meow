<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750">
  <defs>
    <linearGradient id="paper" x2="0" y2="1">
      <stop stop-color="#f6f1e4"/>
      <stop offset="1" stop-color="#eee6d5"/>
    </linearGradient>
    <linearGradient id="tunic" x2="1" y2="1">
      <stop stop-color="#648d78"/>
      <stop offset="1" stop-color="#3f6f61"/>
    </linearGradient>
    <linearGradient id="stoneFront" x2="0" y2="1">
      <stop stop-color="#b9b4a5"/>
      <stop offset="1" stop-color="#8f8c80"/>
    </linearGradient>
    <radialGradient id="fireGlow">
      <stop stop-color="#ffd36d" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#f47e37" stop-opacity=".72"/>
      <stop offset="1" stop-color="#d8512d" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <g id="player">
      <!-- contact shadow and two-piece isometric ground patch -->
      <ellipse cx="52" cy="207" rx="49" ry="13" fill="#334c42" opacity=".15" filter="url(#softShadow)"/>
      <path d="M5 202 44 183 98 202 57 220Z" fill="#a9b28c" opacity=".74"/>
      <path d="m44 183 54 19-41 18-22-8Z" fill="#929e79" opacity=".5"/>
      <!-- far boot and trouser leg -->
      <path d="m59 144 19 2 5 42-17 9-13-9Z" fill="#755541"/>
      <path d="m66 185 16 2 8 8-4 8-22-1-8-5Z" fill="#463b32"/>
      <path d="m66 192 22 2-2 5-19-1Z" fill="#6c5948"/>
      <!-- near boot and trouser leg -->
      <path d="m32 144 26 1-2 39-14 12-17-4 4-20Z" fill="#866249"/>
      <path d="m28 185 15 5 5 7-4 8-24-2-5-6Z" fill="#493d32"/>
      <path d="m19 195 28 2-3 5-22-2Z" fill="#705b47"/>
      <!-- tunic silhouette and hem -->
      <path d="m32 74 17-7 18 5 17 7 13 32-11 11-10-13-2 39-48 1-1-39-11 13-10-10 12-34Z" fill="url(#tunic)" stroke="#31594e" stroke-width="2" stroke-linejoin="round"/>
      <path d="m38 138 40 0 0 10-41 0Z" fill="#345b50"/>
      <path d="m36 82 10 7-5 43-8-2Z" fill="#83a38a" opacity=".48"/>
      <!-- belt, buckle, stitched pocket -->
      <path d="m34 119 43-1 1 9-44 2Z" fill="#76553b"/>
      <path d="m52 120 10-1 0 8-10 1Z" fill="#c6a76d"/>
      <path d="m67 94 12 3-1 16-12-1Z" fill="#416a5d" stroke="#86a48b" stroke-width="1.5"/>
      <path d="m70 99 7 1" stroke="#afbea0" stroke-width="1"/>
      <!-- far arm / hand -->
      <path d="m82 81 13 4 12 22-7 9-14-17-12-5Z" fill="#4e7969" stroke="#31594e" stroke-width="2" stroke-linejoin="round"/>
      <path d="m98 107 8-3 7 5-2 8-8 2-6-5Z" fill="#d19a71"/>
      <!-- near arm -->
      <path d="m33 81-12 5-9 22 8 8 12-18 12-6Z" fill="#709580" stroke="#31594e" stroke-width="2" stroke-linejoin="round"/>
      <path d="m12 106 7 1 6 6-3 7-9 0-5-6Z" fill="#d19a71"/>
      <!-- neck, head, ear -->
      <path d="m44 63 1 17 20 1 1-20Z" fill="#bd825f"/>
      <ellipse cx="70" cy="42" rx="4.5" ry="7" fill="#bd825f"/>
      <path d="m46 26 8-10 17-3 13 9 5 15-4 19-12 13-16-2-12-12-4-16Z" fill="#d9a17a" stroke="#8f624b" stroke-width="2" stroke-linejoin="round"/>
      <!-- face turned three-quarter toward viewer -->
      <path d="m52 24 17-8 16 9 4 14-8-4-4-7-9 6-17 0Z" fill="#554238"/>
      <path d="m77 39 6 1" stroke="#4b3b32" stroke-width="2.2" stroke-linecap="round"/>
      <path d="m88 44 4 2-5 5-3-1Z" fill="#c98762"/>
      <path d="m72 54 10 2-3 4-8-1Z" fill="#9b5d4a"/>
      <circle cx="81" cy="40" r="1.5" fill="#302e2a"/>
      <path d="m49 28 8-11" stroke="#79604a" stroke-width="3" stroke-linecap="round"/>
      <!-- iron axe in the right hand -->
      <path d="m105 112 29-53" stroke="#6a4835" stroke-width="7" stroke-linecap="round"/>
      <path d="m132 62 5-12 7 1 6 10-7 17-14-4-4-7Z" fill="#9ca9a6" stroke="#596663" stroke-width="2" stroke-linejoin="round"/>
      <path d="m138 53 6 1 4 7-7 15-6-2 7-15Z" fill="#d0d2c7"/>
      <path d="m105 110 4-8" stroke="#bd9566" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="furnace">
      <ellipse cx="76" cy="148" rx="73" ry="13" fill="#33443a" opacity=".15" filter="url(#softShadow)"/>
      <!-- chimney rises from the back-left -->
      <path d="m46 58 12-25 22-6 13 15-3 25Z" fill="#77796f" stroke="#5e625a" stroke-width="2"/>
      <path d="m58 33 22-6 13 6-22 7Z" fill="#c4bdad"/>
      <path d="m47 57 13-4 1 14-12 5Z" fill="#62665e"/>
      <path d="m62 53 31-7 0 17-31 7Z" fill="#918d80"/>
      <path d="m56 29 25-7 18 6-27 8Z" fill="#9b978a" stroke="#696d65" stroke-width="2"/>
      <!-- stacked irregular stone body -->
      <path d="m18 72 59-21 63 20-61 25Z" fill="#d1c9b7" stroke="#77766d" stroke-width="2" stroke-linejoin="round"/>
      <path d="m18 72 61 24 0 51-60-24Z" fill="url(#stoneFront)" stroke="#77766d" stroke-width="2"/>
      <path d="m79 96 61-25-1 52-60 24Z" fill="#77796f" stroke="#62665e" stroke-width="2"/>
      <!-- stone courses, each kept broad enough to read at sprite scale -->
      <path d="m20 88 59 23m-57-2 57 23m-34-58 0 15m32-3 0 20m-31 3 0 20" fill="none" stroke="#686b62" stroke-width="2" opacity=".62"/>
      <path d="m80 112 59-25m-60 48 60-25m-28-51 1 18m30 10-1 17m-31 13 0 19" fill="none" stroke="#575c55" stroke-width="2" opacity=".62"/>
      <!-- dark arched fire mouth inset in front face -->
      <path d="M47 139v-22a31 31 0 0 1 62 0v22Z" fill="#373d38" stroke="#5f6259" stroke-width="3"/>
      <ellipse cx="78" cy="122" rx="25" ry="24" fill="url(#fireGlow)"/>
      <path d="M58 138v-20a20 20 0 0 1 40 0v20Z" fill="#382e27"/>
      <path d="m64 136 13-9 18 9Z" fill="#dc7037"/>
      <path d="m73 135 5-18 8 18Z" fill="#ffca65"/>
      <path d="m66 139 25 0" stroke="#76563b" stroke-width="4" stroke-linecap="round"/>
      <!-- small fuel logs at side -->
      <path d="m105 145 22-10 9 5-22 11Z" fill="#76513b"/>
      <path d="m105 145 0 6 9 5 0-5Z" fill="#513d31"/>
      <ellipse cx="136" cy="140" rx="4" ry="3" fill="#c28c58"/>
      <path d="m110 154 24-11 8 5-24 11Z" fill="#8d6243"/>
      <ellipse cx="143" cy="148" rx="4" ry="3" fill="#d1a06b"/>
      <!-- little ash stones in front -->
      <path d="m52 149 16-5 9 4-17 6Z" fill="#c4b9a2"/>
      <path d="m84 151 14-5 7 4-15 6Z" fill="#ada896"/>
    </g>
  </defs>

  <rect width="1000" height="750" fill="url(#paper)"/>
  <circle cx="886" cy="102" r="165" fill="#e1e5d6" opacity=".55"/>
  <path d="M0 505Q260 455 490 500T1000 465V750H0Z" fill="#e4e8d8" opacity=".62"/>
  <path d="M0 537Q200 500 410 530T1000 512" fill="none" stroke="#d3ddcc" stroke-width="2"/>

  <!-- small editorial header -->
  <text x="58" y="59" fill="#456252" font-family="sans-serif" font-size="15" font-weight="700" letter-spacing="2.2">1 · CODE-DRAWN</text>
  <text x="58" y="92" fill="#273e35" font-family="Georgia, serif" font-size="27">A quiet woodland kit</text>
  <text x="60" y="117" fill="#758174" font-family="sans-serif" font-size="12" letter-spacing=".5">FORMED FROM SIMPLE GAME-READY SHAPES</text>
  <path d="M58 134H942" stroke="#d2d7ca" stroke-width="1"/>

  <!-- hero ground, character and furnace -->
  <path d="m199 440 100-48 122 47-100 51Z" fill="#b7c19c" opacity=".75"/>
  <path d="m608 442 93-45 120 46-94 47Z" fill="#b7c19c" opacity=".75"/>
  <g transform="translate(232 220) scale(1.24)"><use href="#player"/></g>
  <g transform="translate(647 251) scale(1.25)"><use href="#furnace"/></g>

  <!-- material-callout labels -->
  <g font-family="sans-serif">
    <text x="199" y="494" fill="#314d40" font-size="15" font-weight="700">Player</text>
    <text x="199" y="513" fill="#798476" font-size="11" letter-spacing=".6">TRAVELER · HAND-HELD IRON AXE</text>
    <text x="685" y="494" fill="#314d40" font-size="15" font-weight="700">Basic furnace</text>
    <text x="685" y="513" fill="#798476" font-size="11" letter-spacing=".6">STACKED STONE · WOOD-FIRED</text>
  </g>

  <!-- scale comparison panel -->
  <path d="M58 552H942" stroke="#c9d1c4" stroke-width="1"/>
  <text x="60" y="579" fill="#536b59" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1.6">GAME SCALE</text>
  <text x="940" y="579" text-anchor="end" fill="#879083" font-family="sans-serif" font-size="11">SPRITES SHOWN AT THEIR WORLD-SIZE READ</text>
  <path d="m387 666 104-50 119 48-103 53Z" fill="#cad2b4" opacity=".82"/>
  <g transform="translate(426 591) scale(.34)"><use href="#player"/></g>
  <g transform="translate(553 570) scale(.65)"><use href="#furnace"/></g>
  <text x="437" y="715" fill="#657767" font-family="sans-serif" font-size="11">PLAYER · 70 PX</text>
  <text x="585" y="715" fill="#657767" font-family="sans-serif" font-size="11">FURNACE · 104 PX</text>
  <text x="940" y="715" text-anchor="end" fill="#a0a294" font-family="Georgia, serif" font-size="12" font-style="italic">friendly forms, no machinery</text>
</svg>
