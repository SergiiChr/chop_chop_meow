# Settings for the Python checks run by `./build.py check`.

[tool.mypy]
strict = true
python_version = "3.10"
explicit_package_bases = true
files = ["build.py", "tools"]

[tool.ruff]
target-version = "py310"
include = ["build.py", "tools/*.py"]

[tool.ruff.lint]
extend-select = ["E402", "I", "UP", "B", "RUF"]
